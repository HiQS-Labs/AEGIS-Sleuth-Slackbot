    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p7-retire-mutable-writes.md
    artifact: src/completion-store.js,src/reminders-module.js,src/state-snapshot-writer.js,tests/derived-snapshot-writer.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3
    depends_on: p6

  - id: p8
    name: "Reversibility drill — prove every switch flips back"
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p8-reversibility-drill.md
    artifact: tests/p3-reversibility-drill.test.js,docs/p3-rollback-runbook.md
    turn_timeout_s: 900
    max_review_rounds: 2
    depends_on: p7
