# MARATHON.yaml — "Ledger" (RELEASES.md → Release 1.5.0), Phase 3 ONLY.
#
# Run:
#   .xyz/relay-automation/marathon.sh --plan PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/MARATHON.yaml \
#     --pre-advance-cmd "npm test"
#
# ALWAYS --dry-run first.
#
# --pre-advance-cmd IS REQUIRED. This repo has no root-level validate.sh, which is the default
# pre-advance gate. Without the override the marathon fails fast rather than silently skipping the
# gate — supply `npm test` (1513 tests, ~7s) as the real gate.
#
# ── NO FRONT GATE ────────────────────────────────────────────────────────────────────────────
# The Phase 2 prod cutover previously blocked this plan from firing at all. Operator decision
# 2026-08-07: it is NOT a precondition. A switch on a remote server does not gate whether local
# code gets built, reviewed and tested — it gates whether that code is live. It has moved to
# "POST-DEPLOYMENT SWITCH" at the bottom of this header. Do not re-add it here.
#
# ── SCOPE CEILING ────────────────────────────────────────────────────────────────────────────
# Operator decision 2026-08-07: push through Phases 3, 4 AND 5 rather than stopping at Phase 3,
# on the condition that every authority flip is a switch that can be flipped back. That condition
# replaces the earlier stop-and-re-decide checkpoint for these phases.
#
# PHASE 6 IS SPLIT (operator request 2026-08-07: "make it less extreme and reversible"). Phase 6 as
# written bundles four things, and only ONE of them is a one-way door:
#
#   reversible → collapse CompletionStore into a projection
#   reversible → delete the bespoke durability queue + FlushAsync shutdown coupling
#   reversible → add snapshotting/compaction
#   ONE-WAY    → leave no fresh on-disk state to fall back to
#
#   p8 = Phase 6a. Retires the MUTABLE write path and takes all three reversible items. The JSON is
#        still produced, but DERIVED — a projection snapshot written through durable-write.js
#        instead of mutable in-place writes. The old machinery is genuinely gone; the fallback file
#        stays fresh and legacy-loadable, so rollback remains a flag flip.
#
#   Phase 6b — dropping the derived writer so no on-disk fallback exists — is NOT in this release.
#        It is the only truly one-way step, and it is separated out rather than bundled with
#        cleanup that does not need to be one-way. It returns as its own release after 6a has
#        soaked in production and snapshot restore has been exercised for real.
#
# Phase 7 remains out of scope.
#
# ── REVERSIBILITY CONTRACT — binding on every phase ──────────────────────────────────────────
#   (a) every flip is an env var, default OFF; unset == today's behavior byte-for-byte
#   (b) mutable JSON writes CONTINUE in every phase, so the fallback is never stale
#   (c) any projection error falls back to the authoritative store, logged, never user-visible —
#       the pattern already shipped at src/reminders-app-mention-handler.js:1250
#   (d) each phase ships a TESTED rollback: a test that flips the switch OFF and asserts correct
#       behavior. A rollback path that has never been exercised is not a rollback.
#   (e) staged rollout — one workspace first (Phase 4 spec)
#
# A phase that cannot satisfy (a)-(d) must HALT and escalate rather than ship. That is the whole
# basis on which the checkpoint was waived.
#
# p1-p4 are strictly ADDITIVE (no write-path change, no authority boundary). p5 and p6 DO move
# authority — which is exactly why the contract above is binding on them.
#
# ── POST-DEPLOYMENT SWITCH — the Phase 2 cutover, moved here from the front ───────────────────
# An operator ops action with no code change, so it is not a phase. It runs AFTER this plan's work
# is built, reviewed, merged and deployed — never before it starts:
#
#   1. deploy the merged phase work
#   2. run `scripts/baseline-import.js --write` on prod
#   3. flip `SUMMARIZE_WEEK_COMPLETED_SOURCE=projection`
#   4. staged rollout, one workspace first (Neochrome) — contract item (e)
#
# Why this is safe as a post-gate rather than a precondition:
#   - NO phase artifact reads SUMMARIZE_WEEK_COMPLETED_SOURCE. The flag is confined to
#     src/reminders-app-mention-handler.js:1250, and its test sets the flag itself, so the suite
#     never depends on prod state. Verified 2026-08-07.
#   - the validation that originally justified the front gate ALREADY HAPPENED: GH-355's baseline
#     import took the prod shadow-diff from 11 mismatches to 0 (only the documented +/-1ms
#     completedMs divergence remains). The substrate is proven, so building on it is not
#     speculative — which was the front gate's whole argument.
#   - every flip is default-OFF per contract item (a), so merged-but-unflipped code is inert in
#     production by construction.
#
# Still true, and not a reason to withhold code: until step 3 is flipped, the log is written but
# not read as truth. That is a deployment state to close out, not a build blocker.

name: ledger-p3-entity-linking

phases:
  - id: p1
    name: Normalized projection inputs for entity linking
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p1-projection-inputs.md
    artifact: src/entity-projection-inputs.js,tests/entity-projection-inputs.test.js
    turn_timeout_s: 900
    max_review_rounds: 2

  - id: p2
    name: Candidate generation and multi-signal scoring
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p2-candidates-and-scoring.md
    artifact: src/entity-linking.js,tests/entity-linking.test.js
    turn_timeout_s: 900
    max_review_rounds: 2
    depends_on: p1

  - id: p3
    name: Clustering into canonical entities and alias table
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p3-clustering.md
    artifact: src/entity-read-model.js,tests/entity-read-model.test.js
    turn_timeout_s: 900
    max_review_rounds: 2
    depends_on: p2

  - id: p4
    name: Diagnostics, low-confidence queue, human override lane
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p4-diagnostics-and-override.md
    artifact: scripts/entity-linking-diagnostics.js,tests/entity-linking-diagnostics.test.js
    turn_timeout_s: 900
    max_review_rounds: 2
    depends_on: p3

  # ── Authority moves from here. The reversibility contract at the top is binding. ──
  - id: p5
    name: "Phase 4 — boot-time rebuild from the log, behind a reversible flag"
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p5-boot-rebuild.md
    artifact: src/reminders-module.js,src/completion-store.js,tests/boot-rebuild-from-log.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3
    depends_on: p4

  - id: p6
    name: "Phase 5 — migrate remaining projections, with a parity harness"
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p6-remaining-projections.md
    artifact: src/reminders-projection.js,scripts/projection-parity-harness.js,tests/projection-parity.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3
    depends_on: p5

  - id: p7
    name: "Phase 6a — retire the mutable write path, keep a derived snapshot"
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p7-retire-mutable-writes.md
    artifact: src/completion-store.js,src/reminders-module.js,src/state-snapshot-writer.js,tests/derived-snapshot-writer.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3
    depends_on: p6

  - id: p8
    name: "Reversibility drill — prove every switch flips back"
    reviewer: agy
    brief: PROJECT/2-WORKING/P3-EVENT-SOURCED-CORE/briefs/p8-reversibility-drill.md
    # package.json is IN this lane on purpose. p6 and p7 both wrote their suites against node:test
    # — correctly, since every ledger/projection suite here does — but registering such a file takes
    # TWO package.json edits (jest.testPathIgnorePatterns so Jest does not glob it, and the test:node
    # file list so node --test runs it). package.json was outside both lanes, so containment left the
    # file unregisterable and Jest failed the gate with "must contain at least one test" twice. An
    # artifact list bounds what a lane can REPAIR, not just what it may write.
    artifact: tests/p3-reversibility-drill.test.js,docs/p3-rollback-runbook.md,package.json
    turn_timeout_s: 900
    max_review_rounds: 2
    depends_on: p7
