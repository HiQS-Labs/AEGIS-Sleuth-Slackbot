# MARATHON.yaml — the five fixes from the 2026-08-18 GLM 5.3 QA review of `development` @ 11d9e4e.
#
# Fire with:
#   .xyz/relay-automation/marathon.sh \
#     --plan PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/MARATHON.yaml \
#     --pre-advance-cmd "npm test"
#
# The --pre-advance-cmd is REQUIRED: this repo has no root-level validate.sh, so the default gate
# would fail fast. `npm test` is the real gate (jest, then node:test) and is green on 11d9e4e, so
# no --pre-advance-baseline is needed — any non-zero exit is a genuine regression.
#
# SEQUENCING: phases run strictly one at a time in plan order. `depends_on` only constrains that
# order, it does not create parallelism. Declared here only where a real write-set collision exists:
# p4 and p3 both edit src/chat-module.js, and p5's CHANGELOG entry must describe finished work.
# p1 and p2 carry no depends_on because nothing they touch is produced by an earlier phase — that is
# a statement about correctness, not a claim that they run concurrently.
#
# Write-set map:
#   p1  src/reminders-ai-pipeline.js, tests/reminders-ai-pipeline.test.js
#   p2  tests/ocr-failure-diagnostics.test.js                              (new file, tests only)
#   p3  src/chat-module.js, tests/attachment-pipeline-entry-point.test.js
#   p4  src/chat-commands/convert-to-list-command.js, src/chat-module.js,
#       tests/convert-to-list-command.test.js                              (new file)
#   p5  CHANGELOG.md
#
# Only p3 and p4 overlap. p2 deliberately takes a NEW test file rather than extending
# attachment-pipeline-entry-point.test.js, so it cannot collide with p3.

name: dev-qa-2026-08-18
phases:
  - id: p1
    name: "GH-94 — apply jitter after the past-date rollover"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/briefs/p1-gh94-jitter-ordering.md
    artifact: src/reminders-ai-pipeline.js,tests/reminders-ai-pipeline.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3

  - id: p2
    name: "Cover the GH-76/GH-88 merge seam: OCR failures must carry the diagnostics baseline"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/briefs/p2-ocr-seam-coverage.md
    artifact: tests/ocr-failure-diagnostics.test.js
    turn_timeout_s: 900
    max_review_rounds: 2

  - id: p3
    name: "GH-95 — one normalized command string for both the fallthrough and the router"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/briefs/p3-gh95-normalization.md
    artifact: src/chat-module.js,tests/attachment-pipeline-entry-point.test.js
    turn_timeout_s: 1200
    max_review_rounds: 3

  - id: p4
    name: "GH-96 — route the three bypassing error posts through BuildErrorReportAsync"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/briefs/p4-gh96-diagnostics-bypasses.md
    artifact: src/chat-commands/convert-to-list-command.js,src/chat-module.js,tests/convert-to-list-command.test.js
    turn_timeout_s: 1200
    depends_on: p3
    max_review_rounds: 3

  - id: p5
    name: "CHANGELOG — backfill GH-91 and record GH-94/95/96 plus the seam coverage"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-18-DEV-QA/briefs/p5-changelog.md
    artifact: CHANGELOG.md
    turn_timeout_s: 900
    depends_on: p4
    max_review_rounds: 2
