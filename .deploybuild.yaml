# DeployHQ build pipeline — quality gate before upload.
# https://www.deployhq.com/support/build-pipelines/deploybuild-dot-yaml
#
# This pipeline gates DEPLOYS. It does not replace GitHub Actions, which gates PULL REQUESTS
# (the `test` status check main's branch protection requires) and runs the weekly full-tree
# TruffleHog scan. Both exist on purpose, at different stages — see GH-15.

build_languages:
  - name: "node"
    # 22 (2026-08-27): the empirical matrix — node 18 fails `npm ci` on the build box (a
    # devDependency wants >=20; the servers are fine because deploy.sh installs --omit=dev),
    # node 20 passes jest but exits 1 in `npm run test:node` (older node:test runner; 20 is
    # also past EOL per the build image's own notice), node 22 runs the full suite clean.
    # Build node only gates tests — servers rebuild their own deps at their own node.
    version: "22"

build_commands:
  - description: "Install dependencies"
    command: "npm ci"
    halt_on_error: true

  - description: "Typecheck"
    command: "npm run build"
    halt_on_error: true

  - description: "Test suite"
    # Tuned for DeployHQ's small build box, where plain `npm test` died mid-run twice (GH-143):
    #  - --maxWorkers=2 --workerIdleMemoryLimit=800MB: the full 125-suite run accumulates heap;
    #    the limit recycles a worker instead of letting the box OOM-kill the run (--runInBand was
    #    tried and died the same way — one process, nowhere to recycle).
    #  - DeployHQ's log API keeps only step status, not stdout, so a bare failure is undebuggable
    #    from the CLI. On failure, print the log tail so the reason lands in the build output.
    # Both halves log to a file and replay it on failure. Output is visible in the DeployHQ web
    # dashboard only (the CLI/API drops build-command stdout and stderr both — verified 2026-08-27),
    # so the failing half must say which it is and dump its log to stdout for the dashboard.
    # Logs live in /tmp, NOT the tree: the sanitize-scan step runs after this one and would scan
    # them — jest output quotes test-fixture mock tokens, which would fail the secret gate.
    command: "bash -c 'node -v; npx jest --maxWorkers=2 --workerIdleMemoryLimit=800MB --forceExit > /tmp/jest-build.log 2>&1 || { echo BUILD-GATE-JEST-FAILED; tail -60 /tmp/jest-build.log; exit 1; }; tail -3 /tmp/jest-build.log; npm run --silent test:node > /tmp/node-test.log 2>&1 || { echo BUILD-GATE-TEST-NODE-FAILED; cat /tmp/node-test.log; exit 1; }; tail -8 /tmp/node-test.log'"
    halt_on_error: true

  - description: "Secret and PII scan"
    command: "./utils/sanitize-scan.sh --allowlist utils/sanitize-allowlist.txt"
    halt_on_error: true

  # GH-18. Lives HERE, not in GitHub Actions, on purpose: a check inside ci.yml cannot notice
  # ci.yml being deleted (#14) — it just stops running. DeployHQ is a different system, so it
  # still fires. Catches both the deletion (#14) and the silent trigger-stripping (#13), the
  # latter of which git merged with no conflict at all.
  # ESCAPE HATCH: if GitHub Actions is ever removed deliberately, delete this step in the SAME
  # change. Failing to do so blocks every deploy — which is the coupling that caused #14. The
  # message below says so at the moment it fires, so the fix is never a mystery.
  - description: "Guard: CI workflow intact (GH-18)"
    command: "test -f .github/workflows/ci.yml && grep -qE \"^[[:space:]]*pull_request:\" .github/workflows/ci.yml && grep -qE \"^[[:space:]]*schedule:\" .github/workflows/ci.yml || { echo \"GUARD FAILED (GH-18): .github/workflows/ci.yml is missing or no longer carries its pull_request: and schedule: triggers. pull_request produces the test status check that main branch protection requires; schedule runs the weekly full-tree TruffleHog scan. Restore them, or -- if GitHub Actions was removed ON PURPOSE -- delete this guard step from .deploybuild.yaml as part of the same change.\"; exit 1; }"
    halt_on_error: true
