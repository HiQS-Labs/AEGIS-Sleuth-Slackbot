<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleuth Admin</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; }
    main { max-width: 720px; margin: 48px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
    h1 { margin-top: 0; }
    button { padding: 10px 14px; border: none; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    p { color: #444; }
  </style>
</head>
<body>
  <main>
    <h1>Sleuth Admin</h1>
    <p>Authentication is configured. The AI asset editor UI arrives in Phase 2.</p>
    <p><a href="/admin/reminders.html">Open the Reminders Dashboard &rarr;</a></p>
    <button id="LogoutButton" type="button">Log out</button>
  </main>

  <script>
    const SessionToken = sessionStorage.getItem('adminSessionToken');
    if(!SessionToken)
      window.location.href = '/admin/login.html';

    const LogoutButton = document.getElementById('LogoutButton');
    LogoutButton.addEventListener('click', async () => {
      try {
        await fetch('/admin/logout', {
          method: 'POST',
          headers: { Authorization: `Bearer ${SessionToken}` }
        });
      } catch(error) {
        // ignore network errors and continue local logout.
      }

      sessionStorage.removeItem('adminSessionToken');
      window.location.href = '/admin/login.html';
    });
  </script>
</body>
</html>
