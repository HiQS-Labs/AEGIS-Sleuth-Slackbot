<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleuth Admin Password Reset</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; }
    main { max-width: 460px; margin: 64px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 24px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    .status { margin-top: 14px; min-height: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Reset Admin Password</h1>
    <form id="ResetForm">
      <label for="NewPasswordInput">New password</label>
      <input id="NewPasswordInput" type="password" minlength="8" required autocomplete="new-password">

      <label for="ConfirmPasswordInput">Confirm password</label>
      <input id="ConfirmPasswordInput" type="password" minlength="8" required autocomplete="new-password">

      <button type="submit">Update password</button>
      <div id="StatusMessage" class="status"></div>
    </form>
  </main>

  <script>
    const ResetForm = document.getElementById('ResetForm');
    const NewPasswordInput = document.getElementById('NewPasswordInput');
    const ConfirmPasswordInput = document.getElementById('ConfirmPasswordInput');
    const StatusMessage = document.getElementById('StatusMessage');
    const TokenValue = new URLSearchParams(window.location.search).get('token') || '';

    function SetStatus(ArgText, ArgIsError = false) {
      StatusMessage.textContent = ArgText;
      StatusMessage.style.color = ArgIsError ? '#b3261e' : '#137333';
    }

    ResetForm.addEventListener('submit', async ArgEvent => {
      ArgEvent.preventDefault();
      if(TokenValue.length === 0) {
        SetStatus('Reset token is missing.', true);
        return;
      }

      if(NewPasswordInput.value !== ConfirmPasswordInput.value) {
        SetStatus('Passwords do not match.', true);
        return;
      }

      SetStatus('Updating password...');
      try {
        const Response = await fetch('/admin/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: TokenValue,
            newPassword: NewPasswordInput.value
          })
        });
        const Payload = await Response.json();
        if(!Payload.success) {
          SetStatus(Payload.data || 'Reset failed.', true);
          return;
        }

        SetStatus('Password updated. Redirecting to login...');
        setTimeout(() => {
          window.location.href = '/admin/login.html';
        }, 1200);
      } catch(error) {
        SetStatus('Reset request failed.', true);
      }
    });
  </script>
</body>
</html>
